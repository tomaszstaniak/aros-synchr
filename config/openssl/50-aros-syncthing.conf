# OpenSSL Configure target for building libcrypto/libssl into aros-syncthing.
# Passed with --config; nothing in the OpenSSL tree is edited for it.
#
# Our own definition rather than contrib's 15-aros.conf: that one also links
# -lmiami for OpenSSL's own apps and tests, which this build does not make
# (no-apps no-tests); the libraries themselves reference no Miami symbol.
my %targets = (
    "aros-syncthing-x86_64" => {
        inherit_from     => [ "BASE_unix" ],
        sys_id           => "AROS",
        CC               => "$ENV{'ST_CC'}",
        CFLAGS           => "$ENV{'ST_CFLAGS'}",
        AR               => "$ENV{'ST_AR'}",
        ARFLAGS          => "qc",
        RANLIB           => "$ENV{'ST_RANLIB'}",
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        perl_platform    => 'Unix',
        # Switches added by patches/openssl-4.0.1/0002 and 0003; defined only
        # here, so other AROS builds of OpenSSL keep upstream behaviour.
        defines          => add("AROS_ST_NO_GETADDRINFO", "AROS_ST_NO_STRERROR_R"),
        thread_scheme    => "(unknown)",
    },
    # Native Raspberry Pi (raspi-aarch64): the same definition; LP64 like
    # x86_64. The compiler wrapper adds -mcmodel=large and -ffixed-x18.
    "aros-syncthing-aarch64" => {
        inherit_from     => [ "aros-syncthing-x86_64" ],
    },
);
